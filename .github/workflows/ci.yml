name: ProofPilot checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_production:
        description: Also test the public production interface without credentials or writes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SDK tooling
        run: pip install -r requirements.txt
      - name: GenVM lint and pinned SDK compatibility
        run: |
          genvm-lint check contracts/proof_pilot_v3.py --json
          genvm-lint check contracts/proof_pilot_v4.py --json
          python scripts/check-candidate-sdk.py
          python scripts/check-object-sdk.py
      - name: Install locked dependencies
        run: npm ci
      - name: JavaScript and adapter tests
        run: npm test
      - name: Python contract-logic tests (mock GenVM)
        run: npm run test:contract
      - name: Type checking
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile offline demo
        run: npx playwright test
      - name: Preserve browser verification footage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: test-results/
          retention-days: 7

  production-browser:
    name: Public production desktop and mobile walkthrough
    if: github.event_name == 'workflow_dispatch' && inputs.test_production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          PROOFPILOT_TEST_URL: https://proofpilot-anza0x.vercel.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-verification
          path: test-results/
          retention-days: 7
