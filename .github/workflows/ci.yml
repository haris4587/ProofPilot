name: ProofPilot checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SDK tooling
        run: pip install -r requirements.txt
      - name: GenVM lint and pinned SDK compatibility
        run: |
          genvm-lint check contracts/proof_pilot_v3.py --json
          python scripts/check-candidate-sdk.py
      - name: Install locked dependencies
        run: npm ci
      - name: JavaScript and adapter tests
        run: npm test
      - name: Python contract-logic tests (mock GenVM)
        run: npm run test:contract
      - name: Type checking
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile offline demo
        run: npx playwright test
      - name: Preserve browser verification footage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: test-results/
          retention-days: 7
